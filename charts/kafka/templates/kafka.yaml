apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
spec:
  kafka:
    version: 3.7.0
    replicas: {{ .Values.controller.replicaCount }}
    {{- if .Values.image }}
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    {{- end }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: {{ .Values.controller.replicaCount }}
      transaction.state.log.replication.factor: {{ .Values.controller.replicaCount }}
      transaction.state.log.min.isr: 1
      default.replication.factor: {{ .Values.controller.replicaCount }}
      min.insync.replicas: 1
      inter.broker.protocol.version: "3.7"
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.controller.persistence.size }}
        deleteClaim: false
    resources:
      requests:
        cpu: "{{ .Values.controller.resources.requests.cpu }}"
        memory: "{{ .Values.controller.resources.requests.memory }}Gi"
      limits:
        cpu: "{{ .Values.controller.resources.limits.cpu }}"
        memory: "{{ .Values.controller.resources.limits.memory }}Gi"
    {{- if .Values.extraEnvVars }}
    template:
      pod:
        env:
          {{- toYaml .Values.extraEnvVars | nindent 10 }}
    {{- end }}
  zookeeper:
    replicas: {{ .Values.controller.replicaCount }}
    {{- if .Values.image }}
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    {{- end }}
    storage:
      type: persistent-claim
      size: {{ .Values.controller.persistence.size }}
      deleteClaim: false
    resources:
      requests:
        cpu: "{{ .Values.controller.resources.requests.cpu }}"
        memory: "{{ .Values.controller.resources.requests.memory }}Gi"
      limits:
        cpu: "{{ .Values.controller.resources.limits.cpu }}"
        memory: "{{ .Values.controller.resources.limits.memory }}Gi"
