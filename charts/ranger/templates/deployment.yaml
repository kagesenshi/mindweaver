apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ranger.fullname" . }}
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ranger.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ranger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      {{- if .Values.admin.ssl.enabled }}
      initContainers:
        - name: prepare-truststore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - sh
            - -c
            - |
              cp /opt/java/openjdk/jre/lib/security/cacerts /etc/ranger/truststore/truststore.jks || cp /opt/java/openjdk/lib/security/cacerts /etc/ranger/truststore/truststore.jks
              /opt/java/openjdk/bin/keytool -importcert -alias mindweaver-ca -file /tls-secret/ca.crt -keystore /etc/ranger/truststore/truststore.jks -storepass changeit -noprompt || keytool -importcert -alias mindweaver-ca -file /tls-secret/ca.crt -keystore /etc/ranger/truststore/truststore.jks -storepass changeit -noprompt
          volumeMounts:
            - name: tls-certs-secret
              mountPath: /tls-secret
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/ranger/truststore
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ranger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ if .Values.admin.ssl.enabled }}https{{ else }}http{{ end }}
              containerPort: {{ if .Values.admin.ssl.enabled }}6182{{ else }}{{ .Values.service.port }}{{ end }}
              protocol: TCP
          env:
            - name: RANGER_DB_TYPE
              value: {{ .Values.db.type | lower }}
            - name: RANGER_DB_HOST
              value: {{ .Values.db.host | default (printf "%s-postgresql" (include "ranger.fullname" .)) | quote }}
            - name: RANGER_DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: RANGER_DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: RANGER_DB_USER
              value: {{ .Values.db.user | quote }}
            - name: RANGER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: db-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: db-root-password
            - name: RANGER_DB_ROOT_USER
              value: {{ .Values.db.rootUser | quote }}
            - name: RANGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: admin-password
            - name: RANGER_KEYADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: keyadmin-password
            - name: RANGER_TAGSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: tagsync-password
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: usersync-password
            - name: RANGER_AUDIT_STORE
              value: {{ .Values.admin.auditStore | default "solr" | quote }}
            - name: RANGER_AUDIT_HDFS_DEST_DIR
              value: {{ .Values.admin.auditHdfsDestDir | default "" | quote }}
            - name: RANGER_EXTERNAL_URL
              value: {{ .Values.admin.externalUrl | quote }}
            - name: SETUP_RANGER
              value: "true"
            - name: RANGER_PROPS_DIR
              value: /home/ranger/additional_props
            - name: RANGER_DEFAULT_CONF_DIR
              value: /home/ranger/conf_dir
            - name: DEBUG_ADMIN
              value: "false"
            - name: JAVA_HOME
              value: /opt/java/openjdk
            {{- if or .Values.admin.ssl.enabled .Values.admin.javaOpts }}
            - name: JAVA_OPTS
              value: "{{ if .Values.admin.ssl.enabled }}-Djavax.net.ssl.trustStore=/etc/ranger/truststore/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit{{ end }}{{ if and .Values.admin.ssl.enabled .Values.admin.javaOpts }} {{ end }}{{ .Values.admin.javaOpts | default "" }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /login.jsp
              port: {{ if .Values.admin.ssl.enabled }}https{{ else }}http{{ end }}
              scheme: {{ if .Values.admin.ssl.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /login.jsp
              port: {{ if .Values.admin.ssl.enabled }}https{{ else }}http{{ end }}
              scheme: {{ if .Values.admin.ssl.enabled }}HTTPS{{ else }}HTTP{{ end }}
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            {{- if .Values.admin.ssl.enabled }}
            - name: tls-certs-secret
              mountPath: /etc/ranger/tls
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/ranger/truststore
            {{- end }}
            {{- if .Values.admin.additionalProperties }}
            - name: additional-props
              mountPath: /home/ranger/additional_props
            {{- end }}
            {{- if .Values.admin.confSecret }}
            - name: conf-dir
              mountPath: /home/ranger/conf_dir
            {{- end }}
      volumes:
        {{- if .Values.admin.ssl.enabled }}
        - name: tls-certs-secret
          secret:
            secretName: {{ include "ranger.fullname" . }}-tls
        - name: truststore-volume
          emptyDir: {}
        {{- end }}
        {{- if .Values.admin.additionalProperties }}
        - name: additional-props
          secret:
            secretName: {{ include "ranger.fullname" . }}-passwords
            items:
              - key: additional.properties
                path: additional.properties
        {{- end }}
        {{- if .Values.admin.confSecret }}
        - name: conf-dir
          secret:
            secretName: {{ .Values.admin.confSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
