apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ranger.fullname" . }}-usersync
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
    app.kubernetes.io/component: usersync
spec:
  replicas: {{ .Values.usersync.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "ranger.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: usersync
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ranger.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: usersync
    spec:
      {{- if .Values.admin.ssl.enabled }}
      initContainers:
        - name: prepare-truststore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - sh
            - -c
            - |
              cp /opt/java/openjdk/jre/lib/security/cacerts /etc/ranger/truststore/truststore.jks || cp /opt/java/openjdk/lib/security/cacerts /etc/ranger/truststore/truststore.jks
              /opt/java/openjdk/bin/keytool -importcert -alias mindweaver-ca -file /tls-secret/ca.crt -keystore /etc/ranger/truststore/truststore.jks -storepass changeit -noprompt || keytool -importcert -alias mindweaver-ca -file /tls-secret/ca.crt -keystore /etc/ranger/truststore/truststore.jks -storepass changeit -noprompt
          volumeMounts:
            - name: tls-certs-secret
              mountPath: /tls-secret
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/ranger/truststore
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ranger.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: usersync
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RANGER_COMPONENT
              value: "usersync"
            - name: RANGER_ADMIN_URL
              value: "{{ if .Values.admin.ssl.enabled }}https{{ else }}http{{ end }}://{{ include "ranger.fullname" . }}:{{ .Values.service.port }}"
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ranger.fullname" . }}-passwords
                  key: usersync-password
            - name: SETUP_RANGER
              value: "true"
            - name: RANGER_PROPS_DIR
              value: /home/ranger/additional_props
            - name: JAVA_HOME
              value: /opt/java/openjdk
            {{- if .Values.admin.ssl.enabled }}
            - name: JAVA_OPTS
              value: "-Djavax.net.ssl.trustStore=/etc/ranger/truststore/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
            {{- end }}
          resources:
            {{- toYaml .Values.usersync.resources | default .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.admin.ssl.enabled }}
            - name: tls-certs-secret
              mountPath: /tls-secret
              readOnly: true
            - name: truststore-volume
              mountPath: /etc/ranger/truststore
            {{- end }}
            {{- if .Values.admin.additionalProperties }}
            - name: additional-props
              mountPath: /home/ranger/additional_props
            {{- end }}
      volumes:
        {{- if .Values.admin.ssl.enabled }}
        - name: tls-certs-secret
          secret:
            secretName: {{ include "ranger.fullname" . }}-tls
        - name: truststore-volume
          emptyDir: {}
        {{- end }}
        {{- if .Values.admin.additionalProperties }}
        - name: additional-props
          secret:
            secretName: {{ include "ranger.fullname" . }}-passwords
            items:
              - key: additional.properties
                path: additional.properties
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
