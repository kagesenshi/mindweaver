apiVersion: v1
kind: Service
metadata:
  name: {{ include "ranger.fullname" . }}
  labels:
    {{- include "ranger.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ if .Values.admin.ssl.enabled }}https{{ else }}http{{ end }}
      protocol: TCP
      name: {{ if .Values.admin.ssl.enabled }}https{{ else }}http{{ end }}
  selector:
    {{- include "ranger.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
